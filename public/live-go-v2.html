<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>RedCode 直播｜正在帶你入 Facebook…</title>
<!--
  RedCode 直播跳板頁 v2（v2.2.15，2026-09-30 老闆指令）
  老闆拍板流程（Android 同 iPhone 一視同仁）：
    撳推播 → ①即刻自動試開 Facebook app → ②客人去唔到 app，先自動落 FB 網頁版。
  點解要新檔名 live-go-v2.html：
    v2.2.14 改完老闆實測「都係無彈」——public/ 入面嘅檔冇 hash，
    佢部機嘅瀏覽器好可能 cache 住咗 v2.2.8 舊版（intent:// 嗰版），即係測緊舊嘢。
    新檔名＝全新 URL，保證每部機都攞到最新版；舊 live-go.html 變咗做轉址殼，
    通知欄入面嘅舊推播撳落去一樣會過嚟呢版。
  自動開 app 三槍（擋咗一槍仲有下槍）：
    ① fb://facewebmodal 深鏈（老闆部機實證「立即入直播」金掣用呢招彈到）
    ② Android 補 Chrome 專用 intent://（pinned package 直開）；iOS 補隱形 iframe
    ③ 6 秒都冇反應（多數冇裝 app）→ 自動落 FB 網頁版
  仲有：成版任何位撳一下都會再觸發 fb://（用戶手勢，擋自動跳嘅瀏覽器都一定彈），
  頁面一 hidden（入咗 app）即刻清晒 timer。
  安全：?u= 只准 facebook.com／fb.watch／fb.me 連結，其他一律踢返首頁（擋 open-redirect）。
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1a2340 0%, #0b1020 60%);
    color: #e8eaf2;
    font-family: "Noto Serif TC", "PMingLiU", serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .card { padding: 32px 28px; max-width: 420px; }
  img.logo { width: 168px; height: auto; opacity: 0.95; }
  h1 { font-size: 20px; font-weight: 600; margin: 22px 0 8px; letter-spacing: 0.05em; }
  p.sub { font-size: 14px; color: #9aa3c0; margin: 0 0 10px; line-height: 1.7; }
  .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #ff0054; margin-right: 8px; vertical-align: middle;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  .arrow {
    font-size: 26px; color: #f5c518; margin: 6px 0 2px; line-height: 1;
    animation: hop 1.2s ease-in-out infinite;
  }
  @keyframes hop { 0%,100% { transform: translateY(0); } 50% { transform: translateY(7px); } }
  a.btn {
    position: relative;
    display: inline-block; padding: 15px 44px; border-radius: 999px;
    background: #f5c518; color: #0b1020; text-decoration: none;
    font-size: 18px; font-weight: 700; letter-spacing: 0.03em;
  }
  a.btn::after {
    content: ""; position: absolute; inset: -6px; border-radius: 999px;
    box-shadow: 0 0 22px 4px rgba(245, 197, 24, 0.55);
    animation: btnGlow 1.8s ease-in-out infinite;
    pointer-events: none;
  }
  @keyframes btnGlow { 0%,100% { opacity: 0.35; } 50% { opacity: 1; } }
  a.btn:active { opacity: 0.85; }
  p.web { margin: 24px 0 0; }
  p.web a { color: #9aa3c0; font-size: 13px; text-decoration: underline; }
  @media (prefers-reduced-motion: reduce) { .dot, .arrow, a.btn::after { animation: none; } }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/logo.png" alt="RedCode">
  <h1><span class="dot"></span>正在帶你入 Facebook 直播…</h1>
  <p class="sub">冇彈出嘅話，撳下面個金掣<br>（撳頁面任何位都得）</p>
  <div class="arrow">↓</div>
  <a class="btn" id="manual" href="/">立即入直播</a>
  <p class="web"><a id="weblink" href="/">未裝 Facebook？直接開網頁版 ↗</a></p>
</div>
<script>
(function () {
  var manual = document.getElementById('manual');
  var weblink = document.getElementById('weblink');

  // ① 攞 ?u= 目標連結，只准 FB 系域名（擋 open-redirect 濫用）
  var u = '';
  try {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('u') || '';
    if (raw) {
      var parsed = new URL(raw);
      var host = parsed.hostname.toLowerCase();
      var ok = parsed.protocol === 'https:' &&
        (host === 'facebook.com' || host.endsWith('.facebook.com') ||
         host === 'fb.watch' || host === 'fb.me' || host.endsWith('.fb.me'));
      if (ok) u = raw;
    }
  } catch (e) { u = ''; }

  if (!u) { window.location.replace('/'); return; }

  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);

  // 桌面機：唔使玩深鏈，直接去 FB 網頁版
  if (!isAndroid && !isIOS) {
    weblink.href = u;
    manual.href = u;
    window.location.replace(u);
    return;
  }

  var started = Date.now();
  var fellBack = false;
  var timers = [];
  function later(fn, ms) { timers.push(setTimeout(fn, ms)); }
  function clearAll() { for (var i = 0; i < timers.length; i++) clearTimeout(timers[i]); }
  // 一跳入 app 頁面就會 hidden——即刻清晒後備 timer，免得返轉頭時亂跳
  document.addEventListener('visibilitychange', function () {
    if (document.hidden) clearAll();
  });

  function toWeb() {
    if (fellBack) return;
    fellBack = true;
    window.location.href = u;
  }

  var deep = 'fb://facewebmodal/f?href=' + encodeURIComponent(u);
  weblink.href = u;
  manual.href = deep;

  function fireDeep() {
    try { window.location.href = deep; } catch (e) { /* 靜音 */ }
  }

  // 老闆拍板：「客人唔去 APP，先自動落網頁版」——6 秒後備（有 app 嘅早已 hidden 清 timer）
  later(function () { if (!document.hidden) toWeb(); }, 6000);

  // 金掣係用戶手勢：fb:// 必定彈到；1.5s 冇走（冇裝 app）→ 自己落網頁版
  manual.addEventListener('click', function () {
    later(function () { if (!document.hidden) toWeb(); }, 1500);
  });

  // 成版任何位撳一下都當金掣使（細字網頁版連結除外）——
  // 擋自動跳嘅瀏覽器，只要有手勢就一定彈到 app
  document.addEventListener('pointerdown', function (ev) {
    if (fellBack) return;
    var t = ev.target;
    if (t === weblink) return;
    fireDeep();
  });

  if (isAndroid) {
    // 第一槍：fb://facewebmodal（同網站「立即入直播」金掣同一招）
    fireDeep();
    // 第二槍：Chrome 專用 intent://（pinned package，裝咗 FB 會直開唔使揀）；
    // 唔識 intent:// 嘅瀏覽器會靜音忽略，唔影響第一槍。
    var intentFb = 'intent://facewebmodal/f?href=' + encodeURIComponent(u) +
      '#Intent;scheme=fb;package=com.facebook.katana;action=android.intent.action.VIEW;' +
      'S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
    later(function () {
      if (!document.hidden && !fellBack && Date.now() - started < 5000) {
        try { window.location.href = intentFb; } catch (e) { /* 靜音 */ }
      }
    }, 1200);
    return;
  }

  // iOS：老闆拍板同 Android 一樣「先 APP」。第一槍 location.href 試 fb://；
  // 0.3s 補隱形 iframe（舊式 Safari 有時只吃 iframe 呢招）；
  // 兩招都係靜音失敗就算，6 秒後備照樣落網頁版。
  fireDeep();
  later(function () {
    if (document.hidden || fellBack) return;
    try {
      var iframe = document.createElement('iframe');
      iframe.style.display = 'none';
      iframe.src = deep;
      document.body.appendChild(iframe);
      later(function () {
        if (document.body.contains(iframe)) document.body.removeChild(iframe);
      }, 1500);
    } catch (e) { /* 靜音 */ }
  }, 300);
})();
</script>
</body>
</html>
