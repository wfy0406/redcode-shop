<!DOCTYPE html>
<html lang="zh-HK">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="robots" content="noindex">
<title>RedCode 直播｜正在帶你入 Facebook…</title>
<!--
  RedCode 直播跳板頁（v2.2.8，2026-09-30 老闆指令）
  用途：推播通知撳入嚟 → 即刻試開 Facebook app；
        開唔到（冇裝 app／桌面機）→ 自動落返 facebook.com 網頁版。
  v2.2.8：Android 首選 fb-scheme intent（裝咗 app 一定開到，唔使中 path filter），
          擋咗先試 https intent，再唔得落網頁版；
          推播嗰邊亦會先解短鏈做正式 /watch 連結先派出。
          iOS 維持隱形 iframe 試 fb://facewebmodal。
  安全：?u= 只准 facebook.com／fb.watch／fb.me 連結，其他一律踢返首頁（擋 open-redirect）。
-->
<style>
  html, body { margin: 0; padding: 0; height: 100%; }
  body {
    background: radial-gradient(1200px 800px at 50% -10%, #1a2340 0%, #0b1020 60%);
    color: #e8eaf2;
    font-family: "Noto Serif TC", "PMingLiU", serif;
    display: flex; align-items: center; justify-content: center;
    text-align: center;
  }
  .card { padding: 32px 28px; max-width: 420px; }
  img.logo { width: 168px; height: auto; opacity: 0.95; }
  h1 { font-size: 20px; font-weight: 600; margin: 22px 0 8px; letter-spacing: 0.05em; }
  p.sub { font-size: 14px; color: #9aa3c0; margin: 0 0 26px; line-height: 1.7; }
  .dot {
    display: inline-block; width: 9px; height: 9px; border-radius: 50%;
    background: #ff0054; margin-right: 8px; vertical-align: middle;
    animation: breathe 1.6s ease-in-out infinite;
  }
  @keyframes breathe { 0%,100% { opacity: 1; } 50% { opacity: 0.25; } }
  @media (prefers-reduced-motion: reduce) { .dot { animation: none; } }
  a.btn {
    display: inline-block; padding: 13px 34px; border-radius: 999px;
    background: #f5c518; color: #0b1020; text-decoration: none;
    font-size: 16px; font-weight: 700; letter-spacing: 0.03em;
  }
  a.btn:active { opacity: 0.85; }
</style>
</head>
<body>
<div class="card">
  <img class="logo" src="/logo.png" alt="RedCode">
  <h1><span class="dot"></span>正在帶你入 Facebook 直播…</h1>
  <p class="sub">如果手機有裝 Facebook，會自動幫你開 app；<br>冇嘅話會去網頁版。</p>
  <a class="btn" id="manual" href="/">立即入直播</a>
</div>
<script>
(function () {
  var manual = document.getElementById('manual');

  // ① 攞 ?u= 目標連結，只准 FB 系域名（擋 open-redirect 濫用）
  var u = '';
  try {
    var params = new URLSearchParams(window.location.search);
    var raw = params.get('u') || '';
    if (raw) {
      var parsed = new URL(raw);
      var host = parsed.hostname.toLowerCase();
      var ok = parsed.protocol === 'https:' &&
        (host === 'facebook.com' || host.endsWith('.facebook.com') ||
         host === 'fb.watch' || host === 'fb.me' || host.endsWith('.fb.me'));
      if (ok) u = raw;
    }
  } catch (e) { u = ''; }

  if (!u) { window.location.replace('/'); return; }

  // ② 分平台：桌面機直接開網頁版；Android 用 intent://；iOS 用 fb:// iframe。
  var ua = navigator.userAgent || '';
  var isAndroid = /Android/i.test(ua);
  var isIOS = /iPhone|iPad|iPod/i.test(ua);
  if (!isAndroid && !isIOS) { manual.href = u; window.location.replace(u); return; }

  var parsed2 = new URL(u);
  var started = Date.now();
  var fellBack = false;

  function toWeb() {
    if (fellBack) return;
    fellBack = true;
    window.location.href = u;
  }

  if (isAndroid) {
    // Android Chrome：intent:// 唔使用戶手勢，Chrome 會直接交畀 FB app；
    // 冇裝 app → 自動行 S.browser_fallback_url 去網頁版（唔使猜 timer）。
    // v2.2.8（老闆回報「跳完都係無開 app」）：
    //   首選 fb-scheme intent —— scheme 屬 FB，裝咗 app 就一定開到，
    //   唔使理條 link 嘅 host/path 中唔中 https intent filter
    //   （舊版用 https intent，share/v/ 呢類路徑唔中 filter → 靜音落網頁版）。
    var intentFb = 'intent://facewebmodal/f?href=' + encodeURIComponent(u) +
      '#Intent;scheme=fb;package=com.facebook.katana;action=android.intent.action.VIEW;' +
      'S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
    var intentWeb = 'intent://' + parsed2.host + parsed2.pathname + parsed2.search +
      '#Intent;scheme=https;package=com.facebook.katana;action=android.intent.action.VIEW;' +
      'S.browser_fallback_url=' + encodeURIComponent(u) + ';end';
    manual.href = intentFb;
    try {
      window.location.href = intentFb;
      // 保險①：fb-scheme intent 畀靜音擋 → 1.2s 試 https intent（/watch 路徑 app filter 一定中）
      setTimeout(function () {
        if (!document.hidden && Date.now() - started < 4000) {
          try { window.location.href = intentWeb; } catch (e) { toWeb(); }
        }
      }, 1200);
      // 保險②：兩招都冇反應（舊 WebView 唔識 intent://）→ 2.6s 落網頁版
      setTimeout(function () {
        if (!document.hidden && Date.now() - started < 6000) toWeb();
      }, 2600);
    } catch (e) { toWeb(); }
    return;
  }

  // iOS：手動掣去網頁版最穩（冇裝 app 撳 fb:// 會彈系統錯誤框）；
  // 自動流程用隱形 iframe 靜音試 fb://facewebmodal，1.6s 開唔到就落網頁版。
  manual.href = u;
  var deep = 'fb://facewebmodal/f?href=' + encodeURIComponent(u);
  setTimeout(function () {
    if (!document.hidden && Date.now() - started < 4000) toWeb();
  }, 1600);
  try {
    var iframe = document.createElement('iframe');
    iframe.style.display = 'none';
    iframe.src = deep;
    document.body.appendChild(iframe);
    setTimeout(function () {
      if (document.body.contains(iframe)) document.body.removeChild(iframe);
    }, 1500);
  } catch (e) {
    toWeb();
  }
})();
</script>
</body>
</html>
