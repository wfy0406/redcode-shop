# Render Blueprint — RedCode 購物網
# 用法：Render dashboard → New + → Blueprint → 揀呢個 repo，設定會自動帶入
# 注意：Persistent Disk 只支援付費 plan（Starter 起）；免費 plan 要用嘅話，
#       將下面 disk: 嗰段同 plan: starter 註解，改用 plan: free（但截圖會喺重啟後流失）
services:
  - type: web
    name: redcode-shop
    runtime: docker
    plan: starter
    region: singapore
    healthCheckPath: /api/trpc/ping
    envVars:
      - key: NODE_ENV
        value: production
      - key: JWT_SECRET
        generateValue: true
      - key: DATABASE_URL
        fromDatabase:
          name: redcode-shop-db
          property: connectionString
    disk:
      name: redcode-uploads
      mountPath: /app/uploads
      # v2.2.34：對返 live 實際 10GB——Render 唔俾 blueprint 縮細 disk，
      # 寫細過 live 會 sync 失敗（cannot decrease disk size）
      sizeGB: 10

databases:
  - name: redcode-shop-db
    databaseName: redcode_shop
    region: singapore
    # v2.2.34：對返 live 實際 basic-256mb——Render 唔俾 blueprint 降 plan
    # （cannot downgrade database）；第日想降要喺 dashboard 手動搞
    plan: basic-256mb
